spring.application.name=cine

# Cargar variables desde archivo .env en la raíz del proyecto
spring.config.import=optional:file:./.env[.properties]

# Configuración de Base de Datos MySQL
# Toma los valores de .env si están disponibles
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cine?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate para MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración del Servidor
server.port=6767

# Jackson Configuration
spring.jackson.deserialization.fail-on-null-for-primitives=false
